baseURL = "https://www.whatisverdezul.com/"
languageCode = "en-us"
title = "Verdèzul"
theme = "ryder"

# Emits /robots.txt from layouts/robots.txt. "ROBOTS" must ALSO be listed in
# [outputs] home below — an explicit [outputs] block replaces Hugo's defaults
# rather than merging with them, which is the same trap that requires LLMSTxt
# to be named by hand (see themes/ryder/hugo.toml).
enableRobotsTXT = true

# The band uses neither taxonomy. Left on, Hugo generates empty /categories/
# and /tags/ pages and lists both in sitemap.xml — thin content pointed at
# crawlers for no benefit.
disableKinds = ["taxonomy", "term"]

[build]
  writeStats = true
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.(js|ts|jsx|tsx)"
    target = "js"
  [[build.cachebusters]]
    source = "assets/.*\\.(css|scss|sass)"
    target = "css"

[params]
  description = "Official site for Verdèzul — Los Angeles-based hip-hop duo. Music, shows, merch."
  analytics_provider = "posthog"
  showDarkToggle = false
  darkMode = "off"
  logo_png = "/images/logo-trans-512.png"
  headerType = "-verdezul"
  footerType = "-verdezul"
  menuType = "-verdezul"
  showHomeFeed = false
  showBreadCrumbs = false
  og_image_default = "/images/og/og-home.png"
  
[params.favicon]
    ico            = "/favicon.ico"
    version        = ""
    svg            = ""
    appleTouchIcon = "/apple-touch-icon.png"
    webmanifest    = "/site.webmanifest"

  [[params.favicon.icons]]
    size = "32x32"
    href = "/favicon-32x32.png"
  [[params.favicon.icons]]
    size = "16x16"
    href = "/favicon-16x16.png"

[params.schema]
  type = "MusicGroup"

[params.csp]
  frameSrc = "https://www.youtube-nocookie.com https://open.spotify.com"
  imgSrc = "https://img.youtube.com"
    scriptSrcHashes = ["sha256-gIirzZwKgl/5Zp3caTrb8Q0bQtvKmxH8pbyqwmtSoUk="]
  connectSrc = "https://formspree.io"  # contact form submits here via fetch

[security]
  [security.funcs]
    # ^VERCEL_ lets layouts/home.robots.txt read VERCEL_ENV so preview deploys
    # emit Disallow: /. Removing it does not degrade gracefully — every build
    # fails with "access denied: VERCEL_ENV is not whitelisted". Fails loud on
    # purpose: robots.txt quietly reverting to permissive would be worse.
    getenv = ['^HUGO_', '^CI$', '^PUBLIC_', '^VERCEL_']

[outputs]
  home = ["HTML", "RSS", "LLMSTxt", "ROBOTS"]

[[menus.main]]
  name = "Music"
  url = "/music/"
  weight = 10

[[menus.main]]
  name = "Shows"
  url = "/shows/"
  weight = 20

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 30

[[menus.main]]
  name = "Contact"
  url = "/contact/"
  weight = 40

[[menus.main]]
  name = "Shop"
  url = "/shop/"
  weight = 50
