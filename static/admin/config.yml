backend:
  name: github
  repo: arts-link/whatisverdezul.com
  branch: main
  base_url: https://www.whatisverdezul.com
  auth_endpoint: api/oauth/auth

media_folder: static/images/uploads
public_folder: /images/uploads

collections:

  - name: site-config
    label: Site Config
    files:
      - name: band
        label: Band Info
        file: data/band.json
        format: json
        fields:
          - { name: name, label: Band Name, widget: string }
          - { name: email, label: Contact Email, widget: string }
          - { name: location, label: City, widget: string }
          - { name: bio, label: Bio, widget: text }
      # A list, not fixed fields, so the band can add a platform without a code
      # change and drag the icons into the order they want. List order IS footer
      # order — see layouts/partials/footer-verdezul.html.
      - name: social
        label: Social Links
        file: data/social.json
        format: json
        fields:
          - label: Social Links
            name: items
            widget: list
            label_singular: Social Link
            fields:
              - name: platform
                label: Platform
                widget: select
                hint: "Picks the icon. Choose 'other' for anything not listed and fill in Custom Label."
                options:
                  - instagram
                  - tiktok
                  - youtube
                  - spotify
                  - apple_music
                  - tidal
                  - youtube_music
                  - soundcloud
                  - bandcamp
                  - audiomack
                  - amazon_music
                  - facebook
                  - x
                  - threads
                  - patreon
                  - discord
                  - other
              - name: label
                label: Custom Label
                widget: string
                required: false
                hint: "Only needed when Platform is 'other'. Names the link for screen readers."
              - name: url
                label: URL
                widget: string
                pattern: ['^https?://', "Must be a full link starting with https://"]

  - name: shows
    label: Shows
    files:
      - name: shows
        label: Shows
        file: data/shows.json
        format: json
        fields:
          - label: Shows
            name: items
            widget: list
            label_singular: Show
            fields:
              - { name: title, label: Event Name, widget: string }
              - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { name: city, label: City, widget: string, default: "Los Angeles, CA" }
              - { name: venue, label: Venue, widget: string, required: false }
              - { name: description, label: Description, widget: text, required: false }
              - { name: ticket_url, label: Ticket URL, widget: string, required: false }
              - { name: sold_out, label: Sold Out, widget: boolean, default: false }

  - name: releases
    label: Releases
    files:
      - name: releases
        label: Releases
        file: data/releases.json
        format: json
        fields:
          - label: Releases
            name: items
            widget: list
            label_singular: Release
            fields:
              - { name: title, label: Title, widget: string }
              - { name: type, label: Type, widget: select, options: [album, ep, single] }
              - { name: year, label: Year, widget: number, value_type: int }
              - { name: song_count, label: Song Count, widget: number, value_type: int, min: 1 }
              - { name: description, label: Description, widget: text, required: false }
              - { name: spotify_url, label: Spotify URL, widget: string, required: false }
              - { name: apple_music_url, label: Apple Music URL, widget: string, required: false }
              - { name: cover_image, label: Cover Image, widget: image, required: false }
              # Must stay present: schema-extra.html reads `featured` to emit the
              # MusicAlbum JSON-LD. Without a widget here Decap drops the key from
              # every release the moment an editor saves this collection.
              - { name: featured, label: Featured Release, widget: boolean, default: false }

  - name: streaming
    label: Streaming Page
    files:
      - name: streaming
        label: Streaming Page
        file: data/streaming.json
        format: json
        fields:
          # One list holding every embed, whatever the platform. "Add Embed" is a
          # dropdown (types below), and the list drags freely — so a SoundCloud
          # player can sit between two videos. Nothing has to be grouped by
          # platform, and this order is exactly the page order.
          - label: Embeds
            name: items
            widget: list
            label_singular: Embed
            typeKey: platform
            types:
              - name: youtube
                label: YouTube Video
                fields:
                  - { name: title, label: Video Title, widget: string }
                  - name: youtube_id
                    label: YouTube Video ID
                    widget: string
                    hint: "Just the 11-character ID - the part after v= in the URL. For youtu.be links it is the bit after the slash."
                    pattern: ['^[A-Za-z0-9_-]{11}$', "Paste only the 11-character ID, not the whole YouTube link"]
                  - name: thumbnail
                    label: Thumbnail (optional)
                    widget: image
                    required: false
                    hint: "Leave blank to use YouTube's own image. Upload one only if that image looks grey or blank (happens on low-resolution uploads). 16:9, around 1280x720."
              - name: spotify
                label: Spotify Player
                fields:
                  - { name: title, label: Label, widget: string, hint: "Not shown on the page - used for the player's accessible name and in analytics." }
                  - name: spotify_embed_url
                    label: Spotify Embed URL
                    widget: string
                    hint: "In Spotify: Share -> Embed -> copy the src link."
                    pattern: ['^https://open\.spotify\.com/embed/', "Must be a Spotify embed link (open.spotify.com/embed/...), not a normal share link"]
              - name: soundcloud
                label: SoundCloud Player
                fields:
                  - { name: title, label: Label, widget: string, hint: "Not shown on the page - used for the player's accessible name and in analytics." }
                  - name: soundcloud_url
                    label: SoundCloud Link
                    widget: string
                    hint: "The normal soundcloud.com link to the track, playlist, or profile - straight from the address bar. No embed code needed."
                    pattern: ['^https://soundcloud\.com/', "Paste the soundcloud.com link from the address bar, not the embed code"]
                  - name: player_size
                    label: Player Size
                    widget: select
                    default: compact
                    hint: "Large shows a scrolling track list - best for a profile or playlist. Compact suits a single track."
                    options: [compact, large]

  - name: press
    label: Press Quotes
    files:
      - name: press
        label: Press Quotes
        file: data/press.json
        format: json
        fields:
          - label: Press Quotes
            name: items
            widget: list
            label_singular: Press Quote
            fields:
              - { name: quote, label: Quote, widget: text }
              - { name: source, label: Source, widget: string }
              - { name: url, label: URL, widget: string, required: false }
              - { name: date, label: Date, widget: string, hint: "e.g. 2026-01" }

  - name: merch
    label: Shop / Merch
    files:
      - name: merch
        label: Shop / Merch
        file: data/merch.json
        format: json
        fields:
          - label: Items
            name: items
            widget: list
            label_singular: Item
            fields:
              - { name: name, label: Item Name, widget: string }
              - { name: price, label: Price (USD), widget: number, value_type: float }
              - { name: description, label: Description, widget: text, required: false }
              - { name: image, label: Image, widget: image }
              - { name: checkout_url, label: Checkout URL, widget: string, required: false }
              - { name: sold_out, label: Sold Out, widget: boolean, default: false }

  - name: pages
    label: Page Content
    files:
      - name: home
        label: Home Page
        file: content/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text }
      - name: about
        label: About Page
        file: content/about/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text }
          - { name: body, label: Bio, widget: markdown }
      - name: contact
        label: Contact Page
        file: content/contact/_index.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta Description, widget: text }
